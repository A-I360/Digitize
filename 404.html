<script>
/* Inline boot: theme before first paint + the overlay scaffolding.
   Must stay tiny and dependency-free. Independent timeout failsafes mean no
   overlay can ever trap the visitor, even if the module bundle fails. */
(function () {
  var d = document.documentElement, ls = null, nav = false;
  try { ls = localStorage.getItem('synq:theme'); } catch (e) {}
  try { nav = sessionStorage.getItem('synq:navigating') === '1'; sessionStorage.removeItem('synq:navigating'); } catch (e) {}
  var dark = ls ? ls === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  d.classList.add('js');
  d.classList.toggle('dark', !!dark);
  d.classList.toggle('light', !dark);
  if (nav) d.classList.add('is-route-nav');

  function scaffold() {
    var b = document.createElement('div');
    b.className = 'boot-loader'; b.id = 'boot-loader';
    b.setAttribute('data-boot-loader', '');
    b.setAttribute('role', 'status');
    b.setAttribute('aria-live', 'polite');
    b.setAttribute('aria-label', 'Loading');
    if (nav) b.hidden = true;
    b.innerHTML =
      '<div class="boot-loader__inner">' +
        '<svg class="boot-mark" viewBox="0 0 100 100" aria-hidden="true"><defs>' +
          '<linearGradient id="bootStroke" x1="0" y1="0" x2="1" y2="1">' +
            '<stop offset="0" stop-color="#0b5fff"/><stop offset="1" stop-color="#00c8f0"/>' +
          '</linearGradient></defs>' +
          '<path class="boot-mark__glow" d="M73 27c-6-8-16-12-25-10C35 19 25 29 23 42c-2 14 4 26 15 32 9 5 19 4 27-1"/>' +
          '<path class="boot-mark__path" d="M73 27c-6-8-16-12-25-10C35 19 25 29 23 42c-2 14 4 26 15 32 9 5 19 4 27-1"/>' +
        '</svg>' +
        '<div class="boot-word">SYNQ<small>DIGITAL STUDIO</small></div>' +
        '<div class="boot-bar"><div class="boot-bar__fill" data-boot-fill></div></div>' +
        '<div class="boot-meta"><span>Preparing the studio</span><span data-boot-pct>0%</span></div>' +
      '</div>';
    document.body.appendChild(b);

    var v = document.createElement('div');
    v.className = 'route-veil'; v.id = 'route-veil';
    v.setAttribute('data-route-veil', '');
    v.setAttribute('aria-hidden', 'true');
    v.innerHTML =
      '<div class="route-veil__panel"></div><div class="route-veil__panel"></div>' +
      '<div class="route-veil__panel"></div><div class="route-veil__panel"></div>' +
      '<div class="route-veil__panel"></div>' +
      '<div class="route-veil__mark"><span>SYNQ</span></div>';
    document.body.appendChild(v);

    setTimeout(function () {
      if (!d.classList.contains('is-route-nav')) return;
      d.classList.remove('is-route-nav');
      v.classList.remove('is-covering', 'is-busy');
      v.classList.add('is-revealing');
    }, 2400);
    setTimeout(function () {
      if (b && !b.classList.contains('is-done')) {
        b.classList.add('is-done');
        setTimeout(function () { b.hidden = true; }, 460);
      }
    }, 3400);
  }

  if (document.body) scaffold();
  else document.addEventListener('DOMContentLoaded', scaffold, { once: true });
})();
</script>
